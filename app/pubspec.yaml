name: magic_attendance_app
description: "Magic Attendance System - Prototype Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
  excel: ^4.0.6
  path_provider: ^2.1.6
  open_file: ^4.0.0
  image_picker: ^1.2.3
  audioplayers: ^6.8.1
  intl: ^0.20.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  universal_html: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#002147"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
