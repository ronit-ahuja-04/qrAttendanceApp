<body>
  <!-- Custom camera zoom logic for PWA -->
  <script>
    window.setCameraZoom = function(scale) {
      const videos = document.getElementsByTagName('video');
      if (videos.length > 0) {
        const video = videos[0];
        const stream = video.srcObject;
        if (stream) {
          const track = stream.getVideoTracks()[0];
          if (track) {
            const capabilities = track.getCapabilities();
            if (capabilities && capabilities.zoom) {
              const minZoom = capabilities.zoom.min || 1;
              const maxZoom = capabilities.zoom.max || 5;
              const targetZoom = minZoom + (maxZoom - minZoom) * scale;
              track.applyConstraints({ advanced: [{ zoom: targetZoom }] }).catch(function(e) {
                console.log('Zoom constraint not applied: ' + e);
              });
            }
          }
        }
      }
    };
  </script>

</body>
