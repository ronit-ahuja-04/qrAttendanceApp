name: Ping Render API
on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s https://qr-attendance-api-wvvs.onrender.com > /dev/null
        # Added a silent curl to hit the backend and wake it up
